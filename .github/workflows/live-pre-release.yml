name: Isolated pre-release SDK integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-live-pre-release-${{ github.ref }}
  cancel-in-progress: false

# Web stage design D6 and docs/design/live-suites-on-stage-20261017.md D1:
# pipefail, so `| tee` can't hide a failing script.
defaults:
  run:
    shell: bash

jobs:
  # One stage lease per run, reset around it. Waiting here never spends a
  # suite job's own timeout; the bound outlasts one predecessor's whole hold.
  acquire-stage:
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 690
    environment: sdk-live-pre-release
    steps:
      - name: Acquire the stage lease
        uses: postgrip-io/postgrip-web/.github/actions/stage-lease@7736cf5a1ddfcc5f32241e913bf1e2623c21a22f
        with:
          verb: acquire
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}

  live:
    needs: acquire-stage
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 120
    environment: sdk-live-pre-release
    env:
      POSTGRIP_URL: ${{ vars.POSTGRIP_URL }}
      POSTGRIP_AGENT_URL: ${{ vars.POSTGRIP_AGENT_URL }}
      POSTGRIP_WORKER_URL: ${{ vars.POSTGRIP_WORKER_URL }}
      POSTGRIP_SERVICE_URL: ${{ vars.POSTGRIP_SERVICE_URL }}
      POSTGRIP_TOKEN: ${{ secrets.POSTGRIP_TOKEN }}
      POSTGRIP_LIVE_DISPOSABLE: ${{ vars.POSTGRIP_LIVE_DISPOSABLE }}
      POSTGRIP_LIVE_SCENARIO_GZIP_BASE64: ${{ secrets.POSTGRIP_LIVE_SCENARIO_GZIP_BASE64 }}
      POSTGRIP_AGENT_ID: ${{ vars.POSTGRIP_AGENT_ID }}
      POSTGRIP_AGENT_ACCESS_TOKEN: ${{ secrets.POSTGRIP_AGENT_ACCESS_TOKEN }}
      POSTGRIP_AGENT_REFRESH_TOKEN: ${{ secrets.POSTGRIP_AGENT_REFRESH_TOKEN }}
      POSTGRIP_AGENT_ACCESS_EXPIRES_AT: ${{ vars.POSTGRIP_AGENT_ACCESS_EXPIRES_AT }}
      POSTGRIP_AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.POSTGRIP_AGENT_SIGNING_PRIVATE_KEY }}
      POSTGRIP_LIVE_WORKER_ID: ${{ vars.POSTGRIP_LIVE_WORKER_ID }}
      POSTGRIP_LIVE_REPOSITORY_OWNER: ${{ vars.POSTGRIP_LIVE_REPOSITORY_OWNER }}
      POSTGRIP_LIVE_REPOSITORY_NAME: ${{ vars.POSTGRIP_LIVE_REPOSITORY_NAME }}
      POSTGRIP_LIVE_REPOSITORY_CREDENTIAL: ${{ secrets.POSTGRIP_LIVE_REPOSITORY_CREDENTIAL }}
      POSTGRIP_LIVE_SANDBOX_IMAGE: ${{ vars.POSTGRIP_LIVE_SANDBOX_IMAGE }}
    steps:
      - name: Start the stage lease
        uses: postgrip-io/postgrip-web/.github/actions/stage-lease@7736cf5a1ddfcc5f32241e913bf1e2623c21a22f
        with:
          verb: start
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the unified SDK with sandbox transport
        run: |
          python -m pip install --upgrade build
          python -m build --wheel python
          python -m pip install "python/dist/postgrip-"*.whl "websockets>=13"
      - name: Verify fixture-manager safety invariants
        run: python3 scripts/test_live_api.py --self-test
      - name: Run isolated runtime and destructive scenario
        run: >-
          python3 scripts/test_live_api.py
          --tier pre-release
          --allow-destructive
          --ledger test/reports/live-pre-release-ledger.json
      - name: Upload cleanup ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pre-release-ledger-${{ github.run_id }}
          path: test/reports/live-pre-release-ledger.json
          if-no-files-found: warn
          retention-days: 90

  github-adoption:
    needs: [acquire-stage, live]
    if: ${{ !cancelled() && needs.acquire-stage.result == 'success' }}
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 120
    environment: sdk-live-pre-release
    env:
      POSTGRIP_URL: ${{ vars.POSTGRIP_URL }}
      POSTGRIP_SERVICE_URL: ${{ vars.POSTGRIP_SERVICE_URL }}
      POSTGRIP_TOKEN: ${{ secrets.POSTGRIP_TOKEN }}
      POSTGRIP_GITHUB_LIVE_PROJECT_ID: ${{ vars.POSTGRIP_GITHUB_LIVE_PROJECT_ID }}
      POSTGRIP_GITHUB_TEST_ORG: ${{ vars.POSTGRIP_GITHUB_TEST_ORG }}
      POSTGRIP_GITHUB_TEST_TOKEN: ${{ secrets.POSTGRIP_GITHUB_TEST_TOKEN }}
      POSTGRIP_GITHUB_LIVE_DISPOSABLE: ${{ vars.POSTGRIP_GITHUB_LIVE_DISPOSABLE }}
      POSTGRIP_GITHUB_LIVE_WAIT_FOR_EXPIRY: "true"
      POSTGRIP_GITHUB_LIVE_EXPIRY_WAIT_SECONDS: "3900"
    steps:
      - name: Start the stage lease
        uses: postgrip-io/postgrip-web/.github/actions/stage-lease@7736cf5a1ddfcc5f32241e913bf1e2623c21a22f
        with:
          verb: start
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify GitHub lifecycle safety guards
        run: python3 scripts/test_github_adoption_live.py --self-test
      - name: Prove rotation after expiry and signed merge-to-deploy
        run: >-
          python3 scripts/test_github_adoption_live.py
          --mode pre-release
          | tee test/reports/live-pre-release-github-adoption.json
      - name: Upload GitHub adoption receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pre-release-github-adoption-${{ github.run_id }}
          path: test/reports/live-pre-release-github-adoption.json
          if-no-files-found: warn
          retention-days: 90

  service-domain:
    needs: [acquire-stage, github-adoption]
    if: ${{ !cancelled() && needs.acquire-stage.result == 'success' }}
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    environment: sdk-live-pre-release
    env:
      POSTGRIP_SERVICE_URL: ${{ vars.POSTGRIP_SERVICE_URL }}
      POSTGRIP_TOKEN: ${{ secrets.POSTGRIP_TOKEN }}
      POSTGRIP_SERVICE_ID: ${{ vars.POSTGRIP_SERVICE_ID }}
      POSTGRIP_SERVICE_ENVIRONMENT_ID: ${{ vars.POSTGRIP_SERVICE_ENVIRONMENT_ID }}
      POSTGRIP_SERVICE_DISPOSABLE_DOMAIN_ID: ${{ vars.POSTGRIP_SERVICE_DISPOSABLE_DOMAIN_ID }}
      POSTGRIP_CONFIRM_DISPOSABLE_DOMAIN: ${{ vars.POSTGRIP_CONFIRM_DISPOSABLE_DOMAIN }}
      POSTGRIP_SERVICE_DOMAIN_LIVE_DISPOSABLE: ${{ vars.POSTGRIP_SERVICE_DOMAIN_LIVE_DISPOSABLE }}
    steps:
      - name: Start the stage lease
        uses: postgrip-io/postgrip-web/.github/actions/stage-lease@7736cf5a1ddfcc5f32241e913bf1e2623c21a22f
        with:
          verb: start
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
      - name: Detect disposable Service domain fixture
        id: fixture
        shell: bash
        run: |
          if [[ -n "${POSTGRIP_SERVICE_DISPOSABLE_DOMAIN_ID:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No disposable Service domain fixture is configured; skipping live verification."
          fi
      - if: ${{ steps.fixture.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ steps.fixture.outputs.enabled == 'true' }}
        with:
          python-version: "3.12"
      - name: Verify disposable Service domain safety guards
        if: ${{ steps.fixture.outputs.enabled == 'true' }}
        run: python3 scripts/test_service_domain_verification_live.py --self-test
      - name: Verify public DNS, TLS, route, and HTTP behavior
        if: ${{ steps.fixture.outputs.enabled == 'true' }}
        run: python3 scripts/test_service_domain_verification_live.py

  release-stage:
    needs: [acquire-stage, live, github-adoption, service-domain]
    if: ${{ always() }}
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 30
    environment: sdk-live-pre-release
    steps:
      - name: Release the stage lease
        uses: postgrip-io/postgrip-web/.github/actions/stage-lease@7736cf5a1ddfcc5f32241e913bf1e2623c21a22f
        with:
          verb: release
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
