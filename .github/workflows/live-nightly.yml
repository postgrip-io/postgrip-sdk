name: Nightly disposable SDK integration

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-live-nightly
  cancel-in-progress: false

# Web stage design D6 and docs/design/live-suites-on-stage-20261017.md D1:
# pipefail, so `| tee` can't hide a failing script.
defaults:
  run:
    shell: bash

jobs:
  # One stage lease per run, reset around it. Waiting here never spends a
  # suite job's own timeout; the bound outlasts one predecessor's whole hold.
  acquire-stage:
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 690
    environment: sdk-live-nightly
    steps:
      - name: Check out web's stage actions
        uses: actions/checkout@v4
        with:
          repository: postgrip-io/postgrip-web
          ref: 475427b09f4a864c5d58ac1d4ad070a24f5e9b8a
          ssh-key: ${{ secrets.POSTGRIP_WEB_READ_KEY }}
          persist-credentials: false
          path: .postgrip-web
          sparse-checkout: .github/actions/stage-lease
      - name: Acquire the stage lease
        uses: ./.postgrip-web/.github/actions/stage-lease
        with:
          verb: acquire
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}

  live:
    needs: acquire-stage
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 120
    environment: sdk-live-nightly
    env:
      POSTGRIP_URL: ${{ vars.POSTGRIP_URL }}
      POSTGRIP_AGENT_URL: ${{ vars.POSTGRIP_AGENT_URL }}
      POSTGRIP_WORKER_URL: ${{ vars.POSTGRIP_WORKER_URL }}
      POSTGRIP_SERVICE_URL: ${{ vars.POSTGRIP_SERVICE_URL }}
      POSTGRIP_TOKEN: ${{ secrets.POSTGRIP_TOKEN }}
      POSTGRIP_LIVE_DISPOSABLE: ${{ vars.POSTGRIP_LIVE_DISPOSABLE }}
      # This run's stage-lease ID. The scenario runs only after this job's lease
      # `start` step succeeds, so the fixture manager may leave reset-owned
      # resources for the stage reset that follows the lease's release.
      POSTGRIP_LIVE_STAGE_LEASE: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRIP_LIVE_SCENARIO_GZIP_BASE64: ${{ secrets.POSTGRIP_LIVE_SCENARIO_GZIP_BASE64 }}
      # The disposable Agent's run, and the namespace and queue its scenario
      # identity is limited to; the scenario reads them as ${env.…}.
      POSTGRIP_LIVE_AGENT_RUN: sdk-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRIP_LIVE_AGENT_NAMESPACE: sdk-live-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRIP_LIVE_AGENT_QUEUE: sdk-live-${{ github.run_id }}-${{ github.run_attempt }}-tasks
      POSTGRIP_LIVE_WORKER_ID: ${{ vars.POSTGRIP_LIVE_WORKER_ID }}
      POSTGRIP_LIVE_REASSIGN_WORKER_ID: ${{ vars.POSTGRIP_LIVE_REASSIGN_WORKER_ID }}
      POSTGRIP_LIVE_BLOCKED_CONFIGURATION_OPERATION_ID: ${{ vars.POSTGRIP_LIVE_BLOCKED_CONFIGURATION_OPERATION_ID }}
      POSTGRIP_LIVE_DOMAIN_SUFFIX: ${{ vars.POSTGRIP_LIVE_DOMAIN_SUFFIX }}
      POSTGRIP_LIVE_REPOSITORY_OWNER: ${{ vars.POSTGRIP_LIVE_REPOSITORY_OWNER }}
      POSTGRIP_LIVE_REPOSITORY_NAME: ${{ vars.POSTGRIP_LIVE_REPOSITORY_NAME }}
      POSTGRIP_LIVE_REPOSITORY_BRANCH: ${{ vars.POSTGRIP_LIVE_REPOSITORY_BRANCH }}
      POSTGRIP_LIVE_REPOSITORY_FILE_PATH: ${{ vars.POSTGRIP_LIVE_REPOSITORY_FILE_PATH }}
      POSTGRIP_LIVE_REPOSITORY_CREDENTIAL: ${{ secrets.POSTGRIP_LIVE_REPOSITORY_CREDENTIAL }}
      POSTGRIP_LIVE_SANDBOX_IMAGE: ${{ vars.POSTGRIP_LIVE_SANDBOX_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out web's stage actions
        uses: actions/checkout@v4
        with:
          repository: postgrip-io/postgrip-web
          ref: 475427b09f4a864c5d58ac1d4ad070a24f5e9b8a
          ssh-key: ${{ secrets.POSTGRIP_WEB_READ_KEY }}
          persist-credentials: false
          path: .postgrip-web
      - name: Start the stage lease
        uses: ./.postgrip-web/.github/actions/stage-lease
        with:
          verb: start
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the unified SDK
        run: |
          python -m pip install --upgrade build
          python -m build --wheel python
          python -m pip install "python/dist/postgrip-"*.whl "websockets>=13"
      - name: Verify fixture-manager safety invariants
        run: python3 scripts/test_live_api.py --self-test
      # Web's disposable-agent action, from the web checkout above (design D2):
      # a sandbox Agent on this runner, plus a headless scenario identity.
      - name: Provide the disposable Agent
        id: agent
        uses: ./.postgrip-web/.github/actions/disposable-agent
        with:
          verb: up
          run-id: ${{ env.POSTGRIP_LIVE_AGENT_RUN }}
          postgrip-url: ${{ vars.POSTGRIP_URL }}
          agent-url: ${{ vars.POSTGRIP_AGENT_URL }}
          organization-id: ${{ vars.STAGE_ORGANIZATION_ID }}
          owner-email: ${{ secrets.STAGE_OWNER_EMAIL }}
          owner-password: ${{ secrets.STAGE_OWNER_PASSWORD }}
          namespace: ${{ env.POSTGRIP_LIVE_AGENT_NAMESPACE }}
          queues: ${{ env.POSTGRIP_LIVE_AGENT_QUEUE }}
      - name: Run nightly tenant API scenario
        run: >-
          python3 scripts/test_live_api.py
          --tier nightly
          --allow-destructive
          --ledger test/reports/live-nightly-ledger.json
      - name: Remove the disposable Agent
        if: always()
        uses: ./.postgrip-web/.github/actions/disposable-agent
        with:
          verb: down
          run-id: ${{ env.POSTGRIP_LIVE_AGENT_RUN }}
          postgrip-url: ${{ vars.POSTGRIP_URL }}
          agent-url: ${{ vars.POSTGRIP_AGENT_URL }}
          organization-id: ${{ vars.STAGE_ORGANIZATION_ID }}
          owner-email: ${{ secrets.STAGE_OWNER_EMAIL }}
          owner-password: ${{ secrets.STAGE_OWNER_PASSWORD }}
      - name: Upload cleanup ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-nightly-ledger-${{ github.run_id }}
          path: test/reports/live-nightly-ledger.json
          if-no-files-found: warn
          retention-days: 30

  github-adoption:
    needs: acquire-stage
    if: ${{ !cancelled() && needs.acquire-stage.result == 'success' }}
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 60
    environment: sdk-live-nightly
    env:
      POSTGRIP_URL: ${{ vars.POSTGRIP_URL }}
      POSTGRIP_SERVICE_URL: ${{ vars.POSTGRIP_SERVICE_URL }}
      POSTGRIP_TOKEN: ${{ secrets.POSTGRIP_TOKEN }}
      # The suite creates its own project on this Worker; the stage reset
      # removes it. It is the second stage Worker, which no live scenario puts
      # into maintenance or upgrades, so this job runs alongside `live`
      # (docs/design/live-suites-on-stage-20261017.md D1, D2).
      POSTGRIP_GITHUB_LIVE_WORKER_ID: ${{ vars.POSTGRIP_LIVE_REASSIGN_WORKER_ID }}
      POSTGRIP_LIVE_STAGE_LEASE: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRIP_GITHUB_TEST_ORG: ${{ vars.POSTGRIP_GITHUB_TEST_ORG }}
      POSTGRIP_GITHUB_TEST_TOKEN: ${{ secrets.POSTGRIP_GITHUB_TEST_TOKEN }}
      POSTGRIP_GITHUB_LIVE_DISPOSABLE: ${{ vars.POSTGRIP_GITHUB_LIVE_DISPOSABLE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out web's stage actions
        uses: actions/checkout@v4
        with:
          repository: postgrip-io/postgrip-web
          ref: 475427b09f4a864c5d58ac1d4ad070a24f5e9b8a
          ssh-key: ${{ secrets.POSTGRIP_WEB_READ_KEY }}
          persist-credentials: false
          path: .postgrip-web
          sparse-checkout: .github/actions/stage-lease
      - name: Start the stage lease
        uses: ./.postgrip-web/.github/actions/stage-lease
        with:
          verb: start
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify GitHub lifecycle safety guards
        run: python3 scripts/test_github_adoption_live.py --self-test
      - name: Create, adopt, trigger, rotate, and remove a disposable repository
        run: >-
          python3 scripts/test_github_adoption_live.py
          --mode nightly
          | tee test/reports/live-nightly-github-adoption.json
      - name: Upload GitHub adoption receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-nightly-github-adoption-${{ github.run_id }}
          path: test/reports/live-nightly-github-adoption.json
          if-no-files-found: warn
          retention-days: 30

  service-domain:
    needs: acquire-stage
    if: ${{ !cancelled() && needs.acquire-stage.result == 'success' }}
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    environment: sdk-live-nightly
    env:
      POSTGRIP_SERVICE_URL: ${{ vars.POSTGRIP_SERVICE_URL }}
      POSTGRIP_TOKEN: ${{ secrets.POSTGRIP_TOKEN }}
      POSTGRIP_SERVICE_ID: ${{ vars.POSTGRIP_SERVICE_ID }}
      POSTGRIP_SERVICE_ENVIRONMENT_ID: ${{ vars.POSTGRIP_SERVICE_ENVIRONMENT_ID }}
      POSTGRIP_SERVICE_DISPOSABLE_DOMAIN_ID: ${{ vars.POSTGRIP_SERVICE_DISPOSABLE_DOMAIN_ID }}
      POSTGRIP_CONFIRM_DISPOSABLE_DOMAIN: ${{ vars.POSTGRIP_CONFIRM_DISPOSABLE_DOMAIN }}
      POSTGRIP_SERVICE_DOMAIN_LIVE_DISPOSABLE: ${{ vars.POSTGRIP_SERVICE_DOMAIN_LIVE_DISPOSABLE }}
    steps:
      - name: Check out web's stage actions
        uses: actions/checkout@v4
        with:
          repository: postgrip-io/postgrip-web
          ref: 475427b09f4a864c5d58ac1d4ad070a24f5e9b8a
          ssh-key: ${{ secrets.POSTGRIP_WEB_READ_KEY }}
          persist-credentials: false
          path: .postgrip-web
          sparse-checkout: .github/actions/stage-lease
      - name: Start the stage lease
        uses: ./.postgrip-web/.github/actions/stage-lease
        with:
          verb: start
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
      - name: Detect disposable Service domain fixture
        id: fixture
        shell: bash
        run: |
          if [[ -n "${POSTGRIP_SERVICE_DISPOSABLE_DOMAIN_ID:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No disposable Service domain fixture is configured; skipping live verification."
          fi
      - if: ${{ steps.fixture.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ steps.fixture.outputs.enabled == 'true' }}
        with:
          python-version: "3.12"
      - name: Verify disposable Service domain safety guards
        if: ${{ steps.fixture.outputs.enabled == 'true' }}
        run: python3 scripts/test_service_domain_verification_live.py --self-test
      - name: Verify public DNS, TLS, route, and HTTP behavior
        if: ${{ steps.fixture.outputs.enabled == 'true' }}
        run: python3 scripts/test_service_domain_verification_live.py

  release-stage:
    needs: [acquire-stage, live, github-adoption, service-domain]
    if: ${{ always() }}
    runs-on:
      group: mediumworx
      labels: [self-hosted, linux, x64]
    timeout-minutes: 30
    environment: sdk-live-nightly
    steps:
      - name: Check out web's stage actions
        uses: actions/checkout@v4
        with:
          repository: postgrip-io/postgrip-web
          ref: 475427b09f4a864c5d58ac1d4ad070a24f5e9b8a
          ssh-key: ${{ secrets.POSTGRIP_WEB_READ_KEY }}
          persist-credentials: false
          path: .postgrip-web
          sparse-checkout: .github/actions/stage-lease
      - name: Release the stage lease
        uses: ./.postgrip-web/.github/actions/stage-lease
        with:
          verb: release
          run-id: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          target: ${{ vars.STAGE_LEASE_TARGET }}
          ssh-key: ${{ secrets.STAGE_LEASE_SSH_KEY }}
          known-hosts: ${{ secrets.STAGE_LEASE_KNOWN_HOSTS }}
