name: Publish Python Worker SDK

on:
  push:
    tags:
      - "python-worker/v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Verify tag matches package version
        run: |
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "python-worker/v${package_version}"
      - run: python -m pip install --upgrade build
      - run: python ../scripts/generate_openapi.py --plane worker --check
      - run: python -m build
      - run: python -m pip install dist/postgrip_worker-*.whl
      - name: Test the installed wheel before publishing
        run: python -m unittest discover -s test
      - uses: actions/upload-artifact@v4
        with:
          name: python-worker-dist
          path: python-worker/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/postgrip-worker/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-worker-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
