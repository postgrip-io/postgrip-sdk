name: Publish TypeScript Worker SDK

on:
  push:
    tags:
      - "typescript-worker/v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@postgrip/worker
    defaults:
      run:
        working-directory: typescript-worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "typescript-worker/v${package_version}"
      - run: bun install --frozen-lockfile
      - run: python3 ../scripts/generate_openapi.py --plane worker --check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@^11.5.1"
      - run: npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
