name: Unified SDK validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      force_full:
        description: Keep reusable release validation on the full suite.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.select.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Test CI selection and aggregate gate
        run: python3 -m unittest discover -s scripts -p test_ci_policy.py
      - name: Select validation from the tested PR merge
        id: select
        env:
          CI_FORCE_FULL: ${{ inputs.force_full == true }}
        run: python3 scripts/ci_policy.py

  contracts:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install "cryptography>=42" "jsonschema>=4.23,<5"
      - name: Verify licenses and package layout
        run: |
          cmp LICENSE go/LICENSE
          cmp LICENSE typescript/LICENSE
          cmp LICENSE python/LICENSE
          grep -Fq '"license": "Apache-2.0"' typescript/package.json
          grep -Fxq 'license = "Apache-2.0"' python/pyproject.toml
          python3 scripts/check_package_layout.py --self-test
          python3 scripts/check_package_layout.py
      - name: Verify runtime wire contract
        run: |
          python3 go/protocol/tools/check_drift.py --self-test
          python3 go/protocol/tools/check_drift.py --monorepo
      - name: Verify generated contracts and ownership
        run: |
          python3 scripts/generate_openapi.py --plane all --check
          python3 scripts/check_operation_inventory.py --self-test
          python3 scripts/check_operation_inventory.py
          python3 scripts/generate_test_fixtures.py --check
          python3 scripts/check_operation_coverage.py
          PYTHONPATH=python/src python3 scripts/test_live_api.py --self-test
          python3 scripts/test_service_domain_verification_live.py --self-test
          python3 scripts/test_live_api.py --tier production-smoke --scenario test/live/production-smoke.json --validate-only
      - name: Verify recorded cURL examples
        run: python3 scripts/test_curl_examples.py --plane all

  go:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Check formatting
        run: |
          output=$(gofmt -l go test/runners/go)
          if [ -n "$output" ]; then
            echo "$output" >&2
            exit 1
          fi
      - name: Vet and test standalone module
        working-directory: go
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          go test ./...
      - name: Enforce package coverage floors
        working-directory: go
        env:
          GOWORK: "off"
        run: |
          check_coverage() {
            package="$1"
            minimum="$2"
            profile="/tmp/postgrip-${package##*/}.coverage"
            go test "$package" -coverprofile="$profile"
            actual=$(go tool cover -func="$profile" | awk '/^total:/ {gsub("%", "", $3); print $3}')
            awk -v actual="$actual" -v minimum="$minimum" -v package="$package" 'BEGIN {
              printf "%s statement coverage: %.1f%% (minimum %.1f%%)\n", package, actual, minimum
              if (actual + 0 < minimum + 0) exit 1
            }'
          }
          check_coverage ./agent/activity 97
          check_coverage ./agent/client 52
          check_coverage ./agent/failure 52
          check_coverage ./agent/worker 47
          check_coverage ./agent/workflow 36
          check_coverage ./worker 79
          check_coverage ./service 85

  typescript:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Verify the root facade bundles without Node compatibility
        run: bun build dist/index.js --target=browser --outdir /tmp/postgrip-sdk-browser
      - run: bun run test:coverage
      - run: npm pack --dry-run --json

  python:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build coverage==7.15.0
      - run: python -m build --wheel
      - run: python -m pip install dist/postgrip-*.whl
      - name: Test installed wheel with coverage
        run: |
          python -m coverage run --source=postgrip -m unittest discover -s test
          python -m coverage report --fail-under=80
      - name: Smoke all installed namespaces
        working-directory: /tmp
        run: |
          python -c "from postgrip import PostGrip, AsyncPostGrip; import postgrip.agent, postgrip.worker, postgrip.service"

  recorded-endpoints:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=42" "jsonschema>=4.23,<5"
      - run: bun install --frozen-lockfile
        working-directory: typescript
      - run: python3 scripts/test_api_endpoints.py --plane all

  artifacts:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
        working-directory: typescript
      - run: python -m pip install --upgrade build
      - run: python3 scripts/check_release_artifacts.py --ecosystem all --report /tmp/release-artifacts.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact-report
          path: /tmp/release-artifacts.json

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "mkdocs-material>=9.7,<10"
      - name: Verify generated API documentation
        run: |
          python3 scripts/generate_api_docs.py --check
          python3 scripts/check_api_docs.py
      - run: mkdocs build --strict --site-dir /tmp/postgrip-docs
      - run: mkdocs build --strict --site-dir /tmp/postgrip-typescript-docs
        working-directory: typescript
      - run: mkdocs build --strict --site-dir /tmp/postgrip-python-docs
        working-directory: python

  sdk-validation:
    if: ${{ always() }}
    needs: [changes, contracts, go, typescript, python, recorded-endpoints, artifacts, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected validation job to pass
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_policy.py --check-result
