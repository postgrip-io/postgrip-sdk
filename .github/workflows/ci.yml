name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: protocol/go.mod
      - name: Check formatting
        run: |
          out=$(gofmt -l protocol)
          if [ -n "$out" ]; then
            echo "gofmt-dirty:" >&2
            echo "$out" >&2
            exit 1
          fi
      - run: go vet ./protocol/...
      - run: go test ./protocol/...

  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Check formatting
        run: |
          out=$(gofmt -l go)
          if [ -n "$out" ]; then
            echo "gofmt-dirty:" >&2
            echo "$out" >&2
            exit 1
          fi
      - run: go vet ./go/...
      - run: go test ./go/...
      - name: Enforce coverage for core Agent SDK packages
        working-directory: go
        env:
          GOWORK: "off"
        run: |
          check_coverage() {
            package="$1"
            minimum="$2"
            profile="/tmp/postgrip-${package##*/}.coverage"
            go test "$package" -coverprofile="$profile"
            actual=$(go tool cover -func="$profile" | awk '/^total:/ {gsub("%", "", $3); print $3}')
            awk -v actual="$actual" -v minimum="$minimum" -v package="$package" 'BEGIN {
              printf "%s statement coverage: %.1f%% (minimum %.1f%%)\n", package, actual, minimum
              if (actual + 0 < minimum + 0) exit 1
            }'
          }
          check_coverage ./activity 97
          check_coverage ./client 52
          check_coverage ./failure 52
          check_coverage ./worker 47
          check_coverage ./workflow 36
      - name: Test standalone module against the pinned protocol release
        working-directory: go
        env:
          GOWORK: "off"
        run: go test ./...

  go-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/serviceclient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/serviceclient/go.mod
      - run: go vet ./...
      - name: Test with coverage gate
        run: |
          go test ./... -coverprofile=/tmp/postgrip-service-go.coverage
          actual=$(go tool cover -func=/tmp/postgrip-service-go.coverage | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v actual="$actual" 'BEGIN {
            printf "Service Go SDK statement coverage: %.1f%% (minimum 85.0%%)\n", actual
            if (actual + 0 < 85) exit 1
          }'

  go-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/workerclient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/workerclient/go.mod
      - run: go vet ./...
      - name: Test with coverage gate
        run: |
          go test ./... -coverprofile=/tmp/postgrip-worker-go.coverage
          actual=$(go tool cover -func=/tmp/postgrip-worker-go.coverage | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v actual="$actual" 'BEGIN {
            printf "Worker Go SDK statement coverage: %.1f%% (minimum 80.0%%)\n", actual
            if (actual + 0 < 80) exit 1
          }'

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:coverage

  typescript-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:coverage

  typescript-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-service
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:coverage

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip wheel --no-deps . -w /tmp/wheel
      - run: python -m pip install coverage==7.15.4 /tmp/wheel/postgrip_agent-*.whl
      - name: Test the installed wheel with coverage gate
        run: |
          python -m coverage run --source=postgrip_agent -m unittest discover -s test
          python -m coverage report --fail-under=80

  python-worker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip wheel --no-deps . -w /tmp/worker-wheel
      - run: python -m pip install coverage==7.15.4 /tmp/worker-wheel/postgrip_worker-*.whl
      - name: Test the installed wheel with coverage gate
        run: |
          python -m coverage run --source=postgrip_worker -m unittest discover -s test
          python -m coverage report --fail-under=83

  python-service:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip wheel --no-deps . -w /tmp/service-wheel
      - run: python -m pip install coverage==7.15.4 /tmp/service-wheel/postgrip_service-*.whl
      - name: Test the installed wheel with coverage gate
        run: |
          python -m coverage run --source=postgrip_service -m unittest discover -s test
          python -m coverage report --fail-under=90

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check license consistency
        run: |
          cmp LICENSE protocol/LICENSE
          cmp LICENSE go/LICENSE
          cmp LICENSE typescript/LICENSE
          cmp LICENSE python/LICENSE
          cmp LICENSE typescript-worker/LICENSE
          cmp LICENSE python-worker/LICENSE
          cmp LICENSE typescript-service/LICENSE
          cmp LICENSE python-service/LICENSE
          grep -Fq '"license": "Apache-2.0"' typescript/package.json
          grep -Fq '"license": "Apache-2.0"' typescript-worker/package.json
          grep -Fq '"license": "Apache-2.0"' typescript-service/package.json
          grep -Fxq 'license = "Apache-2.0"' python/pyproject.toml
          grep -Fxq 'license = "Apache-2.0"' python-worker/pyproject.toml
          grep -Fxq 'license = "Apache-2.0"' python-service/pyproject.toml
      - run: python3 protocol/tools/check_drift.py --self-test
      - run: python3 protocol/tools/check_drift.py --monorepo
      - run: python3 scripts/generate_openapi.py --check
      - run: python3 scripts/generate_openapi.py --plane worker --check
      - run: python3 scripts/generate_openapi.py --plane service --check
