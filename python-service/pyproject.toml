[project]
name = "postgrip-service"
version = "0.1.0"
description = "Python SDK for the PostGrip Service API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PostGrip" }]
license = "Apache-2.0"
keywords = ["postgrip", "service", "management", "deploy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/postgrip-io/postgrip-sdks/tree/main/python-service"
Issues = "https://github.com/postgrip-io/postgrip-sdks/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["postgrip_service*"]

[tool.setuptools.package-data]
postgrip_service = ["py.typed"]
