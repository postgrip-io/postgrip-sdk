[project]
name = "postgrip-worker"
version = "0.1.0"
description = "Python SDK for the PostGrip Worker management API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PostGrip" }]
license = "Apache-2.0"
keywords = ["postgrip", "worker", "management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/postgrip-io/postgrip-agent-sdks/tree/main/python-worker"
Issues = "https://github.com/postgrip-io/postgrip-agent-sdks/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["postgrip_worker*"]

[tool.setuptools.package-data]
postgrip_worker = ["py.typed"]
